[project]
name = "ai-test-platform"
version = "0.1.0"
description = "AI 测试管理平台 - WHartTest + OpenCode + LangGraph + RAG + MCP"
requires-python = ">=3.11"

dependencies = [
    # Web 框架 (沿用 WHartTest: Django 5.2 + DRF)
    "django>=5.2",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.3",
    "django-cors-headers>=4.4",
    "drf-spectacular>=0.27",

    # Agent 编排
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "pydantic>=2.0",
    "pydantic-ai>=0.0.14",   # 结构化输出
    "instructor>=1.0",         # LLM 输出校验

    # LLM 调用 (模型无关)
    "litellm>=1.40",           # 统一多模型接口
    "httpx>=0.27",             # 异步 HTTP

    # RAG
    "qdrant-client>=1.10",     # 向量存储
    "sentence-transformers>=3.0",  # 本地嵌入 (备选)

    # MCP (支持 stdio + SSE)
    "mcp>=1.0",                # MCP Python SDK

    # 测试执行
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-json-report>=1.5", # JSON 测试报告
    "playwright>=1.47",        # UI 自动化

    # 数据库断言
    "asyncpg>=0.29",           # PostgreSQL 异步驱动

    # 工具
    "python-jsonpath>=0.11",   # JSONPath 断言
    "structlog>=24.1",         # 结构化日志
    "tenacity>=9.0",           # 重试机制
]

[project.optional-dependencies]
dev = [
    "ipython",
    "ruff",
    "mypy",
    "pre-commit",
]

[tool.ruff]
line-length = 100
target-version = "py311"
